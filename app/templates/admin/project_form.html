{% extends "base.html" %}
{% block title %}{{ 'Edit' if project.id else 'Add' }} Project | Atherton Construction Company{% endblock %}
{% block content %}<section class="admin-page"><div class="container narrow-container"><div class="admin-heading"><div><p class="eyebrow">ATHERTON / ADMIN</p><h1>{{ 'Edit' if project.id else 'Add a' }} <span>project.</span></h1></div><a class="text-link" href="{{ url_for('admin.projects') }}">← Back to projects</a></div><form class="form-card admin-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Project title *<input name="title" required maxlength="160" value="{{ project.title or '' }}"></label><div class="form-row"><label>Category *<select name="category">{% for cat in ['Construction','Electrical','Renovation','Painting','Plumbing','Roofing','Other'] %}<option {% if project.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label><label>Location<input name="location" maxlength="160" value="{{ project.location or '' }}"></label></div><label>Short summary *<input name="summary" required maxlength="320" value="{{ project.summary or '' }}"></label><label>Full description<textarea name="description" rows="6" maxlength="10000">{{ project.description or '' }}</textarea></label><div class="form-row"><label>Status<input name="status" maxlength="50" value="{{ project.status or 'Showcase' }}"></label><label>Completion year<input name="completion_year" maxlength="10" value="{{ project.completion_year or '' }}"></label></div><label>Project image<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"><span class="field-help">PNG, JPG, JPEG, or WEBP. Maximum 8 MB.</span></label><label class="consent"><input type="checkbox" name="is_published" {% if project.is_published or not project.id %}checked{% endif %}> Publish this project on the public website</label><button class="btn btn-teal" type="submit">Save project ↗</button></form></div></section>{% endblock %}
